[package]
name = "suki-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "derive", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6.0"
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
