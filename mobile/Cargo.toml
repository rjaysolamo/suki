[package]
name = "suki-mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "asset", "document"] }

[target.'cfg(target_os = "android")'.dependencies]
